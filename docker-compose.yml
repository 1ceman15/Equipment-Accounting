version: '3.8'

services:
  db:
    image: postgres:16
    container_name: ea-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ea_db
    ports:
      - "5436:5432"
    volumes:
      - ea-postgres:/var/lib/postgresql/data
    networks:
      - equipment-accounting

  backend:
    build: ./Equipment Accounting Backend
    container_name: ea-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ea_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      JWT_SECRET: secret
    depends_on:
      - db
      - redis
    networks:
      - equipment-accounting

  redis:
    image: redis:latest
    container_name: ea_redis
    ports:
      - 6379:6379
    networks:
      - equipment-accounting

  redis-insight:
    image: redis/redisinsight:latest
    container_name: book_network-redis_insight
    ports:
      - 5540:5540
    networks:
      - equipment-accounting
    volumes:
      - redis-insight:/data
    depends_on:
      - redis

networks:
  equipment-accounting:
    driver: bridge

volumes:
  ea-postgres:
  redis-insight:

