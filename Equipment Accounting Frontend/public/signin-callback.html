<!DOCTYPE html>
<html lang="en">
<head>
    <title>Authentication callback processing..</title>
</head>
<body>
<h1>Authentication callback processing...</h1>

<script src="oidc-client.min.js"></script>
<script>
    // Используйте те же настройки, что и в основном приложении
    const settings = {
        authority: "http://localhost:8082/realms/equipment_accounting",
        client_id: "equipment_accounting_frontend",
        redirect_uri: "http://localhost:3000/signin-callback.html",
        response_type: 'code',
        scope: "openid profile equipment_accounting_frontend",
        response_mode: 'query'
    };

    new Oidc.UserManager(settings).signinRedirectCallback()
        .then(function(user) {
            console.log('Signin successful:', user);
            // Задержка 2 секунды перед редиректом (как Thread.sleep(2000) в Java)
            setTimeout(() => window.location = "/", 20000);
        })
        .catch(function(error) {
            console.error('Error during signin callback:', error);
            // Задержка 2 секунды перед редиректом даже при ошибке
            setTimeout(() => window.location = "/", 20000);
        });
</script>
</body>
</html>
